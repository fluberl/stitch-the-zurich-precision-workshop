<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Iframe Test</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: "#000000",
        secondary: "#5b5f63",
        surface: "#fcf8f8",
      },
      spacing: {
        margin: "40px",
        "stack-lg": "32px",
        "stack-md": "16px",
      },
      fontFamily: {
        h1: ["Space Grotesk"],
        "body-md": ["Inter"],
      },
      fontSize: {
        h1: ["32px", { lineHeight: "1.2", fontWeight: "500" }],
        "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
      },
    },
  },
};
</script>
<style>
body {
  background-color: #fcf8f8;
  color: #1c1b1b;
}
</style>
</head>
<body class="font-body-md text-body-md">
<main class="px-3 sm:px-margin py-stack-lg max-w-[1440px] mx-auto">
<h1 class="font-h1 text-h1 mb-stack-md">Iframe Test</h1>
<div class="w-full mx-auto">
<iframe
  src="https://motionmastery.com/ff-test-page/"
  width="100%"
  height="800"
  style="border:0;width:100%;"
  loading="lazy"
  title="MotionMastery test page">
</iframe>
</div>
</main>
</body>
</html>
